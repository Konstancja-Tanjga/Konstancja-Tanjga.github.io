<!doctype html>
<!--
  A path that is not on the user site, such as /work/applus-analytics,
  is a portfolio path without its /portfolio-site/ prefix. Add the
  prefix and keep the rest of the address.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Konstancja Tanjga — Portfolio</title>
  <meta name="robots" content="noindex" />
  <script>location.replace("/portfolio-site" + location.pathname + location.search + location.hash);</script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f0f0e; color: #f1ede4; font: 18px/1.5 system-ui, sans-serif; }
    a { color: #e3d2ad; }
  </style>
</head>
<body>
  <p>The portfolio is at <a href="/portfolio-site/">konstancja-tanjga.github.io/portfolio-site</a>.</p>
</body>
</html>
